<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>КПП — Автосканер</title>
  
  <!-- Supabase, Tesseract и SheetJS для чтения Excel -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #070d19; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Шапка */
    .top-bar {
      padding: 10px 14px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      z-index: 10;
    }
    .sync-info { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #38bdf8; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .header-actions { display: flex; gap: 6px; }
    .btn-icon {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-manual { background: #059669; color: #fff; border-color: #10b981; }
    .btn-list { background: #3b82f6; color: #fff; border-color: #60a5fa; }

    /* Видоискатель автономера */
    .camera-viewport {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }

    .plate-target {
      position: absolute;
      width: 86%;
      max-width: 360px;
      aspect-ratio: 52 / 11.2;
      border: 3px solid #38bdf8;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .plate-target.granted { border-color: #22c55e; box-shadow: 0 0 25px rgba(34, 197, 94, 0.6), 0 0 0 9999px rgba(0, 0, 0, 0.7); }
    .plate-target.exit { border-color: #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.6), 0 0 0 9999px rgba(0, 0, 0, 0.7); }
    .plate-target.denied { border-color: #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.6), 0 0 0 9999px rgba(0, 0, 0, 0.7); }

    .target-hint {
      position: absolute;
      bottom: -28px;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Нижняя карточка информации */
    .bottom-sheet {
      background: #0f172a;
      padding: 14px 16px;
      border-top: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vehicle-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 14px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .plate-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      font-family: monospace;
      color: #f8fafc;
    }

    .vehicle-owner { font-size: 15px; font-weight: 700; color: #38bdf8; margin-top: 2px; }
    .vehicle-desc { font-size: 13px; color: #94a3b8; }
    .vehicle-time { font-size: 12px; color: #cbd5e1; margin-top: 4px; font-weight: 600; }

    .tag-status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      margin-top: 6px;
      width: fit-content;
      text-transform: uppercase;
    }
    .tag-granted { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .tag-exit { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
    .tag-denied { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .btn-capture {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .btn-capture:disabled { opacity: 0.5; }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    
    .modal-content {
      background: #1e293b;
      width: 100%;
      max-width: 440px;
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
    }
    .modal-content input[type="text"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-size: 15px;
    }
    .modal-content input[type="text"]:focus { border-color: #38bdf8; outline: none; }
    .btn-submit { background: #059669; color: #fff; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    /* Панель действий в списке */
    .list-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .btn-excel-import {
      background: #047857;
      color: #fff;
      border: 1px solid #10b981;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Список авто */
    .plate-list-container {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }
    .plate-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .plate-item-meta { display: flex; flex-direction: column; gap: 2px; }
    .plate-item-number { font-size: 16px; font-weight: 800; font-family: monospace; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
    .plate-item-sub { font-size: 12px; color: #94a3b8; }
    
    .badge-inside { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; font-family: sans-serif; font-weight: 700; }
    .badge-outside { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid #475569; font-family: sans-serif; font-weight: 600; }

    .btn-toggle-pass {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .btn-toggle-pass.active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .btn-toggle-pass.inactive { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    canvas { display: none; }
    #excelFileInput { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="sync-info">
      <span class="status-dot" id="dot"></span>
      <span id="syncText">База: связь...</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="torchBtn" onclick="toggleTorch()">🔦 Свет</button>
      <button class="btn-icon btn-list" onclick="openListModal()">📋 Список</button>
      <button class="btn-icon btn-manual" onclick="openModal()">➕ Авто</button>
    </div>
  </div>

  <div class="camera-viewport">
    <video id="v" autoplay playsinline muted></video>
    <div class="plate-target" id="target">
      <span class="target-hint">Номер в рамку</span>
    </div>
  </div>

  <div class="bottom-sheet">
    <div class="vehicle-card">
      <div class="plate-title" id="plateView">НАВЕДИТЕ КАМЕРУ</div>
      <div id="detailsBox" style="display: none;">
        <div class="vehicle-owner" id="ownerView">—</div>
        <div class="vehicle-desc" id="descView">—</div>
        <div class="vehicle-time" id="timeView">—</div>
        <div class="tag-status" id="statusTag">—</div>
      </div>
    </div>
    <button class="btn-capture" id="scanBtn" onclick="scanAutoPlate()">СКАНИРОВАТЬ</button>
  </div>

  <!-- Модалка ручного добавления одного авто -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <h3 style="font-size: 17px; display: flex; justify-content: space-between;">
        Внести автомобиль
        <span style="cursor:pointer; color:#94a3b8;" onclick="closeModal()">✕</span>
      </h3>
      <input type="text" id="mPlate" placeholder="Номер (напр. А123ВС777)" autocapitalize="characters">
      <input type="text" id="mOwner" placeholder="ФИО водителя / пассажира">
      <input type="text" id="mModel" placeholder="Марка авто и роль (VIP, подрядчик)">
      <button class="btn-submit" id="saveBtn" onclick="saveToCloud()">ДОБАВИТЬ В ОБЛАКО</button>
    </div>
  </div>

  <!-- Модалка реестра и импорта Excel -->
  <div class="modal-overlay" id="listModal">
    <div class="modal-content">
      <div class="list-header-bar">
        <h3 style="font-size: 16px;">
          <span>Внутри: <b id="onSiteCount" style="color: #4ade80;">0</b> из <span id="counterSpan">0</span></span>
        </h3>
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
          <button class="btn-excel-import" id="importBtn" onclick="document.getElementById('excelFileInput').click()">
            📂 Импорт Excel
          </button>
          <span style="cursor:pointer; font-size: 18px; color:#94a3b8;" onclick="closeListModal()">✕</span>
        </div>
      </div>

      <input type="text" id="searchInput" placeholder="Быстрый поиск по номеру или ФИО..." oninput="renderFilteredList()">
      <div class="plate-list-container" id="plateListContainer"></div>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script>
    const SUPABASE_URL = 'https://ymabfkywnfaqlxdmxftt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6g_a78Bu4-sFHzWAQIRjlw_Fn6J6WVV';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let CARS_DB = {};
    let isProcessing = false;
    let videoTrack = null;
    let torchActive = false;

    const PLATE_REGEX = /[АВЕКМНОРСТУХABEKMHOPCTYX]\d{3}[АВЕКМНОРСТУХABEKMHOPCTYX]{2}\d{2,3}/;

    const CHAR_CONVERT = {
      'A':'А', 'B':'В', 'E':'Е', 'K':'К', 'M':'М', 'H':'Н',
      'O':'О', 'P':'Р', 'C':'С', 'T':'Т', 'Y':'У', 'X':'Х'
    };

    const v = document.getElementById('v');
    const c = document.getElementById('c');
    const scanBtn = document.getElementById('scanBtn');
    const target = document.getElementById('target');
    const plateView = document.getElementById('plateView');
    const detailsBox = document.getElementById('detailsBox');
    const ownerView = document.getElementById('ownerView');
    const descView = document.getElementById('descView');
    const timeView = document.getElementById('timeView');
    const statusTag = document.getElementById('statusTag');
    const syncText = document.getElementById('syncText');
    const dot = document.getElementById('dot');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        v.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
      } catch (err) {
        alert("Ошибка камеры. Проверьте разрешения в браузере.");
      }
    }

    async function toggleTorch() {
      if (!videoTrack) return;
      const capabilities = videoTrack.getCapabilities();
      if (!capabilities.torch) {
        alert("Вспышка не поддерживается");
        return;
      }
      torchActive = !torchActive;
      await videoTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
      document.getElementById('torchBtn').innerText = torchActive ? "💡 Выкл" : "🔦 Свет";
    }

    function formatTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    async function initCloud() {
      syncText.innerText = "Загрузка...";
      const { data, error } = await db.from('plates').select('*').order('created_at', { ascending: false });
      
      if (error) {
        syncText.innerText = "Офлайн-режим";
        dot.style.background = "#ef4444";
        return;
      }

      CARS_DB = {};
      data.forEach(item => { CARS_DB[item.plate] = item; });
      updateStatusHeader();

      // Realtime
      db.channel('realtime:plates')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'plates' }, payload => {
          const row = payload.new;
          if (row && row.plate) {
            CARS_DB[row.plate] = row;
            updateStatusHeader();
            renderFilteredList();
            if (plateView.innerText === row.plate) displayCarStatus(row);
          }
        })
        .subscribe();
    }

    function updateStatusHeader() {
      const items = Object.values(CARS_DB);
      const total = items.length;
      const inside = items.filter(x => x.is_inside).length;
      syncText.innerText = `В базе: ${total} | Внутри: ${inside}`;
      document.getElementById('counterSpan').innerText = total;
      document.getElementById('onSiteCount').innerText = inside;
    }

    function sanitizePlate(raw) {
      return (raw || '').toString().replace(/[^А-ЯA-Z0-9]/g, '').toUpperCase().split('').map(ch => CHAR_CONVERT[ch] || ch).join('');
    }

    async function scanAutoPlate() {
      if (isProcessing) return;
      isProcessing = true;
      scanBtn.disabled = true;
      scanBtn.innerText = "ОБРАБОТКА...";
      target.className = "plate-target";

      const vW = v.videoWidth;
      const vH = v.videoHeight;
      const cropW = Math.floor(vW * 0.85);
      const cropH = Math.floor(cropW / 4.6);
      const cropX = Math.floor((vW - cropW) / 2);
      const cropY = Math.floor((vH - cropH) / 2);

      c.width = cropW;
      c.height = cropH;
      const ctx = c.getContext('2d');
      ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      // Otsu бинаризация
      const imgData = ctx.getImageData(0, 0, cropW, cropH);
      const d = imgData.data;
      let histogram = new Array(256).fill(0);
      for (let i = 0; i < d.length; i += 4) {
        const gray = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
        d[i] = gray;
        histogram[gray]++;
      }

      let total = d.length / 4, sum = 0;
      for (let t = 0; t < 256; t++) sum += t * histogram[t];
      let sumB = 0, wB = 0, wF = 0, varMax = 0, threshold = 120;

      for (let t = 0; t < 256; t++) {
        wB += histogram[t];
        if (wB === 0) continue;
        wF = total - wB;
        if (wF === 0) break;
        sumB += t * histogram[t];
        let mB = sumB / wB;
        let mF = (sum - sumB) / wF;
        let varBetween = wB * wF * (mB - mF) * (mB - mF);
        if (varBetween > varMax) {
          varMax = varBetween;
          threshold = t;
        }
      }

      for (let i = 0; i < d.length; i += 4) {
        const val = d[i] > threshold ? 255 : 0;
        d[i] = d[i+1] = d[i+2] = val;
      }
      ctx.putImageData(imgData, 0, 0);

      try {
        const { data: { text } } = await Tesseract.recognize(c.toDataURL('image/jpeg', 0.9), 'rus+eng', {
          tessedit_char_whitelist: '0123456789АВЕКМНОРСТУХABEKMHOPCTYX'
        });

        const cleaned = text.toUpperCase().replace(/[^А-ЯA-Z0-9]/g, '');
        const match = cleaned.match(PLATE_REGEX);

        if (match) {
          const plate = sanitizePlate(match[0]);
          plateView.innerText = plate;
          await processVehiclePass(plate);
        } else {
          plateView.innerText = "НЕ РАСПОЗНАН";
          detailsBox.style.display = "none";
        }
      } catch (err) {
        plateView.innerText = "ОШИБКА";
      } finally {
        isProcessing = false;
        scanBtn.disabled = false;
        scanBtn.innerText = "СКАНИРОВАТЬ";
      }
    }

    async function processVehiclePass(plate) {
      detailsBox.style.display = "block";
      const car = CARS_DB[plate];

      if (!car || !car.pass) {
        target.className = "plate-target denied";
        ownerView.innerText = car ? car.name : "Автомобиля нет в списках";
        descView.innerText = car ? (car.role || "Доступ отозван") : "Проезд закрыт";
        timeView.innerText = "";
        statusTag.className = "tag-status tag-denied";
        statusTag.innerText = "ДОСТУП ЗАПРЕЩЕН";
        if (navigator.vibrate) navigator.vibrate(400);
        return;
      }

      const now = new Date().toISOString();
      const nextInside = !car.is_inside;
      
      const { error } = await db.from('plates').update({
        is_inside: nextInside,
        ...(nextInside ? { entered_at: now } : { left_at: now })
      }).eq('plate', plate);

      if (!error) {
        car.is_inside = nextInside;
        if (nextInside) car.entered_at = now; else car.left_at = now;
        displayCarStatus(car, true);
        updateStatusHeader();
        renderFilteredList();
      } else {
        alert("Ошибка записи в базу: " + error.message);
      }
    }

    function displayCarStatus(car, justTriggered = false) {
      detailsBox.style.display = "block";
      ownerView.innerText = car.name || "Без имени";
      descView.innerText = `${car.car || '—'} • ${car.role || 'Допуск'}`;

      if (car.is_inside) {
        target.className = "plate-target granted";
        statusTag.className = "tag-status tag-granted";
        statusTag.innerText = justTriggered ? "ВЪЕЗД ЗАФИКСИРОВАН" : "НА ПЛОЩАДКЕ";
        timeView.innerText = car.entered_at ? `Заезд: ${formatTime(car.entered_at)}` : "Заезд зафиксирован";
        if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
      } else {
        target.className = "plate-target exit";
        statusTag.className = "tag-status tag-exit";
        statusTag.innerText = justTriggered ? "ВЫЕЗД ЗАФИКСИРОВАН" : "ВЫЕХАЛ";
        timeView.innerText = car.left_at ? `Выезд: ${formatTime(car.left_at)}` : "Вне территории";
        if (navigator.vibrate) navigator.vibrate([150]);
      }
    }

    // ИМПОРТ EXCEL / CSV ПРЯМО В ПРИЛОЖЕНИИ
    async function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const importBtn = document.getElementById('importBtn');
      importBtn.innerText = "⏳ Загрузка...";
      importBtn.disabled = true;

      try {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: '' });

        if (!rows.length) {
          alert("Таблица пуста!");
          return;
        }

        const formattedRecords = [];

        rows.forEach(r => {
          // Ищем номер среди возможных названий колонок
          const rawPlate = r['plate'] || r['номер'] || r['Номер'] || r['Госномер'] || r['госномер'] || r['НОМЕР'] || Object.values(r)[0];
          const plate = sanitizePlate(rawPlate);

          if (plate && plate.length >= 6) {
            const name = r['name'] || r['фио'] || r['ФИО'] || r['Водитель'] || r['Имя'] || '';
            const role = r['role'] || r['роль'] || r['Роль'] || r['Категория'] || 'Пропуск';
            const car = r['car'] || r['марка'] || r['Марка'] || r['авто'] || r['Автомобиль'] || '—';
            
            formattedRecords.push({
              plate: plate,
              name: String(name).trim() || 'Гость',
              role: String(role).trim() || 'Пропуск',
              car: String(car).trim() || '—',
              pass: true,
              is_inside: false
            });
          }
        });

        if (!formattedRecords.length) {
          alert("Не удалось распознать автомобильные номера в файле. Проверьте заголовки колонок.");
          return;
        }

        // Пакетная загрузка в Supabase с перезаписью дубликатов (upsert)
        const { error } = await db.from('plates').upsert(formattedRecords, { onConflict: 'plate' });

        if (error) {
          alert("Ошибка импорта в БД: " + error.message);
        } else {
          alert(`Успешно загружено ${formattedRecords.length} авто!`);
          await initCloud();
          renderFilteredList();
        }
      } catch (err) {
        alert("Ошибка чтения файла Excel: " + err.message);
      } finally {
        importBtn.innerText = "📂 Импорт Excel";
        importBtn.disabled = false;
        event.target.value = '';
      }
    }

    function openListModal() {
      document.getElementById('listModal').classList.add('open');
      renderFilteredList();
    }

    function closeListModal() {
      document.getElementById('listModal').classList.remove('open');
    }

    function renderFilteredList() {
      const q = document.getElementById('searchInput').value.trim().toUpperCase();
      const container = document.getElementById('plateListContainer');
      const list = Object.values(CARS_DB).filter(item => {
        const p = (item.plate || '').toUpperCase();
        const n = (item.name || '').toUpperCase();
        const r = (item.role || '').toUpperCase();
        return p.includes(q) || n.includes(q) || r.includes(q);
      });

      if (list.length === 0) {
        container.innerHTML = '<div style="color: #64748b; font-size: 13px; text-align: center; padding: 20px;">Ничего не найдено</div>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="plate-item">
          <div class="plate-item-meta">
            <div class="plate-item-number">
              ${item.plate}
              <span class="${item.is_inside ? 'badge-inside' : 'badge-outside'}">
                ${item.is_inside ? 'НА ПАРКОВКЕ' : 'ВНЕ ПАРКОВКИ'}
              </span>
            </div>
            <span class="plate-item-sub">
              ${item.name || 'Гость'} • ${item.role || '—'}
              ${item.entered_at ? ` | Заезд: ${formatTime(item.entered_at)}` : ''}
              ${item.left_at ? ` | Выезд: ${formatTime(item.left_at)}` : ''}
            </span>
          </div>
          <button class="btn-toggle-pass ${item.pass ? 'active' : 'inactive'}" onclick="togglePassStatus('${item.plate}', ${item.pass})">
            ${item.pass ? 'РАЗРЕШЕН' : 'ЗАПРЕЩЕН'}
          </button>
        </div>
      `).join('');
    }

    async function togglePassStatus(plate, currentPass) {
      const nextPass = !currentPass;
      const { error } = await db.from('plates').update({ pass: nextPass }).eq('plate', plate);
      if (!error) {
        CARS_DB[plate].pass = nextPass;
        renderFilteredList();
        if (plateView.innerText === plate) displayCarStatus(CARS_DB[plate]);
      } else {
        alert("Ошибка обновления статуса: " + error.message);
      }
    }

    function openModal() { document.getElementById('modal').classList.add('open'); }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    async function saveToCloud() {
      const pIn = document.getElementById('mPlate');
      const oIn = document.getElementById('mOwner');
      const mIn = document.getElementById('mModel');
      const saveBtn = document.getElementById('saveBtn');

      const plate = sanitizePlate(pIn.value);
      if (!PLATE_REGEX.test(plate)) {
        alert("Неверный номер. Формат: А123ВС77 или А123ВС777");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "Запись...";

      const now = new Date().toISOString();
      const newRecord = {
        plate: plate,
        name: oIn.value.trim() || "Внеплановый гость",
        role: mIn.value.trim() || "Добавлен на КПП",
        car: "—",
        pass: true,
        is_inside: true,
        entered_at: now
      };

      const { error } = await db.from('plates').upsert([newRecord], { onConflict: 'plate' });
      saveBtn.disabled = false;
      saveBtn.innerText = "ДОБАВИТЬ В ОБЛАКО";

      if (error) {
        alert("Ошибка: " + error.message);
      } else {
        pIn.value = ""; oIn.value = ""; mIn.value = "";
        closeModal();
        CARS_DB[plate] = newRecord;
        plateView.innerText = plate;
        displayCarStatus(newRecord, true);
        updateStatusHeader();
      }
    }

    startCamera();
    initCloud();
  </script>
</body>
</html>
